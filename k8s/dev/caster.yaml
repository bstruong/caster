apiVersion: apps/v1
kind: Deployment
metadata:
  name: caster
  namespace: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caster
  template:
    metadata:
      labels:
        app: caster
    spec:
      initContainers:
      - name: db-migrate
        image: docker.io/library/caster:latest
        imagePullPolicy: Never
        env:
        - name: DATABASE_URL
          value: "postgres://caster:dev@postgres-svc:5432/caster_development"
        - name: RAILS_ENV
          value: development
        command: ["bundle", "exec", "rake", "db:create", "db:migrate"]
      containers:
      - name: caster
        image: docker.io/library/caster:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          value: "postgres://caster:dev@postgres-svc:5432/caster_development"
        - name: RAILS_ENV
          value: development
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: caster-svc
  namespace: development
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: caster
